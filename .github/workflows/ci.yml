name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    name: Tests and packaging check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Lua 5.1 specifically. Libraries/Cerberus sandboxes every file with
      # setfenv/getfenv, which 5.2 deprecated and 5.4 removed, so the suite
      # cannot run on anything newer. WoW is 5.1 regardless.
      - name: Install Lua 5.1
        run: sudo apt-get update -qq && sudo apt-get install -y lua5.1 zip

      - name: Syntax-check every file
        run: |
          fail=0
          for f in $(find . -name '*.lua' -not -path './.git/*'); do
            luac5.1 -p "$f" || { echo "::error file=$f::does not parse"; fail=1; }
          done
          exit $fail

      - name: Run the test suite
        run: lua5.1 Tests/run.lua

      - name: Check the packaging helpers
        run: CF_SELFTEST=1 ./tools/curseforge-upload.sh

      - name: Build the release zip
        run: ./tools/package.sh
